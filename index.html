<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музыкальный плеер</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel-2: #20242d; --text: #eef0f4;
    --muted: #8b93a3; --accent: #7c5cff; --accent-2: #38d4c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 16px;
  }
  .app { width: 100%; max-width: 760px; display: grid; gap: 16px; align-content: start; }
  .player { background: var(--panel); border-radius: 20px; padding: 20px; display: grid; gap: 16px; }
  .now { display: flex; gap: 16px; align-items: center; }
  .cover {
    width: 96px; height: 96px; border-radius: 16px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 40px;
  }
  .meta { min-width: 0; }
  .title { font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  canvas { width: 100%; height: 64px; display: block; border-radius: 12px; background: var(--panel-2); }
  .seek { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: var(--panel-2); flex: 1; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--text); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--text); cursor: pointer; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  button {
    background: var(--panel-2); color: var(--text); border: 0; border-radius: 50%;
    width: 44px; height: 44px; font-size: 18px; cursor: pointer; transition: transform .1s, background .15s;
  }
  button:hover { background: #2a2f3a; }
  button:active { transform: scale(.94); }
  button:focus-visible, .add:focus-within { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  button.on { color: var(--accent-2); }
  button.play { width: 60px; height: 60px; font-size: 24px; background: var(--accent); }
  button.play:hover { background: #6a4af0; }
  .vol { display: flex; align-items: center; gap: 8px; width: 140px; }
  .list { background: var(--panel); border-radius: 20px; padding: 8px; }
  .list-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; gap: 8px; }
  .add { background: var(--accent); border-radius: 999px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  .clear { width: auto; border-radius: 999px; padding: 0 14px; font-size: 14px; height: 36px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 45vh; overflow-y: auto; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; }
  li:hover { background: var(--panel-2); }
  li.active { background: var(--panel-2); color: var(--accent-2); }
  li .n { width: 24px; color: var(--muted); text-align: right; font-size: 13px; }
  li .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .rm { width: 28px; height: 28px; font-size: 14px; background: transparent; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 32px 16px; }
  .drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="app">
  <section class="player">
    <div class="now">
      <div class="cover" id="cover">🎵</div>
      <div class="meta">
        <div class="title" id="title">Выберите музыку</div>
        <div class="sub" id="sub">Добавьте аудиофайлы или перетащите их сюда</div>
      </div>
    </div>
    <canvas id="viz" width="700" height="64"></canvas>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button id="shuffle" title="Перемешать" aria-label="Перемешать">🔀</button>
      <button id="prev" title="Предыдущий" aria-label="Предыдущий">⏮</button>
      <button id="play" class="play" title="Играть / пауза" aria-label="Играть или пауза">▶</button>
      <button id="next" title="Следующий" aria-label="Следующий">⏭</button>
      <button id="repeat" title="Повтор" aria-label="Повтор">🔁</button>
      <div class="vol">🔊<input type="range" id="vol" min="0" max="100" value="80" aria-label="Громкость"></div>
    </div>
  </section>

  <section class="list">
    <div class="list-head">
      <label class="add">+ Добавить файлы<input type="file" id="files" accept="audio/*" multiple></label>
      <button class="clear" id="clear">Очистить</button>
    </div>
    <ul id="tracks"></ul>
    <div class="empty" id="empty">Плейлист пуст</div>
  </section>
</div>

<audio id="audio"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  let tracks = [];          // { name, url }
  let index = -1;
  let shuffle = false;
  let repeat = 0;           // 0 — выкл, 1 — весь список, 2 — один трек
  let seeking = false;

  const fmt = s => {
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return `${m}:${String(r).padStart(2, '0')}`;
  };
  const cleanName = n => n.replace(/\.[^.]+$/, '');

  // ---------- плейлист ----------
  function addFiles(fileList) {
    const added = [...fileList].filter(f => f.type.startsWith('audio/'));
    added.forEach(f => tracks.push({ name: cleanName(f.name), url: URL.createObjectURL(f) }));
    const wasEmpty = index === -1;
    render();
    if (wasEmpty && added.length) load(0, true);
  }

  function render() {
    const ul = $('tracks');
    ul.innerHTML = '';
    tracks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = i === index ? 'active' : '';
      li.innerHTML = '<span class="n"></span><span class="t"></span><button class="rm" title="Удалить" aria-label="Удалить">✕</button>';
      li.children[0].textContent = i === index && !audio.paused ? '▶' : i + 1;
      li.children[1].textContent = t.name;
      li.onclick = () => load(i, true);
      li.children[2].onclick = e => { e.stopPropagation(); remove(i); };
      ul.appendChild(li);
    });
    $('empty').style.display = tracks.length ? 'none' : 'block';
  }

  function remove(i) {
    URL.revokeObjectURL(tracks[i].url);
    tracks.splice(i, 1);
    if (i === index) {
      audio.pause();
      if (tracks.length) { index = Math.min(i, tracks.length - 1); load(index, false); }
      else reset();
    } else if (i < index) index--;
    render();
  }

  function reset() {
    index = -1; audio.removeAttribute('src'); audio.load();
    $('title').textContent = 'Выберите музыку';
    $('sub').textContent = 'Добавьте аудиофайлы или перетащите их сюда';
    $('cur').textContent = $('dur').textContent = '0:00'; $('seek').value = 0;
    updatePlayBtn();
  }

  function load(i, autoplay) {
    index = i;
    const t = tracks[i];
    audio.src = t.url;
    $('title').textContent = t.name;
    $('sub').textContent = `Трек ${i + 1} из ${tracks.length}`;
    document.title = t.name + ' — Плеер';
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: t.name });
    if (autoplay) play();
    render();
  }

  // ---------- управление ----------
  async function play() {
    if (index === -1 && tracks.length) return load(0, true);
    if (index === -1) return;
    initViz();
    if (actx && actx.state === 'suspended') await actx.resume();
    try { await audio.play(); } catch (e) { /* автозапуск мог быть заблокирован */ }
  }
  const toggle = () => audio.paused ? play() : audio.pause();

  function nextIndex(dir) {
    if (!tracks.length) return -1;
    if (shuffle && tracks.length > 1) {
      let n; do { n = Math.floor(Math.random() * tracks.length); } while (n === index);
      return n;
    }
    const n = index + dir;
    if (n >= tracks.length) return repeat === 1 ? 0 : -1;
    if (n < 0) return repeat === 1 ? tracks.length - 1 : 0;
    return n;
  }
  function step(dir) {
    if (dir < 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
    const n = nextIndex(dir);
    if (n === -1) { audio.pause(); audio.currentTime = 0; return; }
    load(n, true);
  }

  function updatePlayBtn() {
    $('play').textContent = audio.paused ? '▶' : '⏸';
    $('cover').textContent = audio.paused ? '🎵' : '🎶';
  }

  $('play').onclick = toggle;
  $('next').onclick = () => step(1);
  $('prev').onclick = () => step(-1);
  $('shuffle').onclick = e => { shuffle = !shuffle; e.currentTarget.classList.toggle('on', shuffle); };
  $('repeat').onclick = e => {
    repeat = (repeat + 1) % 3;
    e.currentTarget.classList.toggle('on', repeat > 0);
    e.currentTarget.textContent = repeat === 2 ? '🔂' : '🔁';
  };
  $('clear').onclick = () => { tracks.forEach(t => URL.revokeObjectURL(t.url)); tracks = []; audio.pause(); reset(); render(); };
  $('files').onchange = e => { addFiles(e.target.files); e.target.value = ''; };

  $('vol').oninput = e => { audio.volume = e.target.value / 100; };
  audio.volume = 0.8;

  const seekEl = $('seek');
  seekEl.oninput = () => { seeking = true; $('cur').textContent = fmt(seekEl.value / 1000 * audio.duration); };
  seekEl.onchange = () => { if (isFinite(audio.duration)) audio.currentTime = seekEl.value / 1000 * audio.duration; seeking = false; };

  audio.onplay = audio.onpause = () => { updatePlayBtn(); render(); };
  audio.onloadedmetadata = () => { $('dur').textContent = fmt(audio.duration); };
  audio.ontimeupdate = () => {
    if (seeking || !isFinite(audio.duration)) return;
    $('cur').textContent = fmt(audio.currentTime);
    seekEl.value = audio.currentTime / audio.duration * 1000;
  };
  audio.onended = () => {
    if (repeat === 2) { audio.currentTime = 0; play(); return; }
    const n = nextIndex(1);
    if (n === -1) { updatePlayBtn(); return; }
    load(n, true);
  };

  // клавиатура и системные кнопки
  document.addEventListener('keydown', e => {
    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName) && e.target.type !== 'range') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight' && e.shiftKey) step(1);
    else if (e.code === 'ArrowLeft' && e.shiftKey) step(-1);
    else if (e.code === 'ArrowRight' && e.target.type !== 'range') audio.currentTime += 5;
    else if (e.code === 'ArrowLeft' && e.target.type !== 'range') audio.currentTime -= 5;
  });
  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', play);
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
    navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
  }

  // drag & drop
  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('drop'); }));
  ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove('drop'); }));
  document.addEventListener('drop', e => addFiles(e.dataTransfer.files));

  // ---------- визуализатор ----------
  let actx, analyser, data;
  const canvas = $('viz'), g = canvas.getContext('2d');
  function initViz() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    const src = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser();
    analyser.fftSize = 128;
    data = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser); analyser.connect(actx.destination);
  }
  function draw() {
    requestAnimationFrame(draw);
    const w = canvas.width, h = canvas.height;
    g.clearRect(0, 0, w, h);
    if (!analyser) return;
    analyser.getByteFrequencyData(data);
    const bars = data.length, bw = w / bars;
    const grad = g.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#7c5cff'); grad.addColorStop(1, '#38d4c0');
    g.fillStyle = grad;
    for (let i = 0; i < bars; i++) {
      const bh = data[i] / 255 * h;
      g.fillRect(i * bw + 1, h - bh, bw - 2, bh);
    }
  }
  draw();

  render();
})();
</script>
</body>
</html>
